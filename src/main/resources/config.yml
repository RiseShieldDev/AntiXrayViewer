# AntiXrayViewer Configuration
# Система записи и воспроизведения активности игроков

# Пороговые значения для обнаружения подозрительной активности
thresholds:
  # Количество алмазной руды подряд для срабатывания системы
  diamond: 5
  # Количество древних обломков (незерит) подряд для срабатывания
  netherite: 3
  # Время в секундах для сброса счетчиков (если игрок не ломал руду)
  reset-time: 60

# Настройки записи движений
recording:
  # Включить систему записи
  enabled: true
  # Длительность записи в секундах (3 минуты по умолчанию)
  duration: 180
  # Интервал записи кадров в тиках (20 тиков = 1 секунда)
  # 2 тика = 0.1 секунды = 10 кадров в секунду
  interval-ticks: 2
  # Максимальное количество сохраненных записей
  max-saved: 50

# Настройки уведомлений
notifications:
  # Отправлять уведомления администраторам
  admin-alerts: true
  # Логировать события в консоль
  console-logging: true

# Сообщения плагина
messages:
  detection: "§c[AntiXrayViewer] §e⚠ Подозрение: §f{player} §7- {reason}"
  recording-started: "§a[AntiXrayViewer] §7Начата запись игрока §f{player}"
  recording-completed: "§a[AntiXrayViewer] §7Запись завершена. ID: §b#{id}"

# Дополнительные настройки
settings:
  # Автоматически удалять старые записи при превышении лимита
  auto-delete-old: true
  # Сохранять записи при перезагрузке сервера (в разработке)
  persist-recordings: false
  # Отображать прогресс записи в action bar игроку (для отладки)
  debug-mode: false
# ========== Настройки воспроизведения (v1.6.0) ==========
replay:
  camera:
    # Режим камеры по умолчанию: FIRST_PERSON, THIRD_PERSON, FREE_LOOK
    #   FIRST_PERSON — глаза игрока и его взгляд (рекомендуется)
    #   THIRD_PERSON — камера за спиной, видна модель игрока
    #   FREE_LOOK — свободный полёт, плагин вас не двигает вообще
    default-mode: FIRST_PERSON
    # Сглаживание движения камеры: 0 = жёстко по записи, 0.9 = очень плавно
    smoothing: 0.35
    # Дистанция камеры в режиме от третьего лица (блоки)
    third-person-distance: 4.0
    # Показывать модель записанного игрока (видна ТОЛЬКО зрителю)
    show-avatar: true
  performance:
    # Максимум обновлений блоков на тик (защита от лаг-спайков при перемотке)
    block-updates-per-tick: 256
    # Радиус отправки виртуальных блоков (блоки)
    block-render-distance: 96.0
    # Радиус анимации трещин, частиц и звуков (блоки)
    break-animation-distance: 48.0
  playback:
    default-speed: 1.0
    max-speed: 8.0
    # Частицы и звуки разрушения — отправляются ТОЛЬКО зрителю
    particles: true
    sounds: true
